[package]
name = "omnirecall"
version = "0.1.0"
description = "OmniRecall: local-first personal context engine"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[lib]
name = "omnirecall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
tauri-plugin-global-shortcut = "=2.4.1"
arboard = { version = "=3.7.0", default-features = false, features = ["wayland-data-control"] }
active-win-pos-rs = "=0.11.0"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
getrandom = "=0.3.4"
base64 = "=0.22.1"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
xcap = "=0.9.8"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "=0.13.2", features = ["randr", "screensaver"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
