[package]
name = "omnirecall"
version = "0.1.0"
description = "OmniRecall: local-first personal context engine"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[lib]
name = "omnirecall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
