name: Release

# Builds the installers on each OS, installs each one on the runner, and checks
# install, upgrade (reinstall over itself), and uninstall with data kept.
# A tag such as v0.1.0-beta.1 also creates a draft release with the installers,
# SHA256SUMS.txt, an SBOM, and build provenance attestations. Installers are
# not code-signed yet (docs/release.md). Toolchains are pinned so a release can
# be rebuilt from its tag with the same inputs.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/package_engine.py"
      - "scripts/build_tesseract_windows.py"
      - "scripts/smoke_engine.py"
      - "scripts/install_check.py"
      - "scripts/sbom.py"
      - "services/local-engine/packaging/**"
      - "apps/desktop/src-tauri/tauri.release.conf.json"
      - "apps/desktop/src-tauri/src/paths.rs"

permissions:
  contents: read

jobs:
  build:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,rpm
          - os: macos-14
            bundles: dmg
          - os: windows-2022
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      UV: uv run --project services/local-engine --frozen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - name: Build timestamp from the commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build tools and Tesseract
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev rpm xvfb tesseract-ocr tesseract-ocr-eng
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install tesseract dylibbundler; fi

      - name: vcpkg binary cache (Windows Tesseract)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-tesseract-${{ hashFiles('scripts/build_tesseract_windows.py') }}
      - name: Static Tesseract without curl or JBIG (Windows, OR-030)
        if: runner.os == 'Windows'
        shell: bash
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-cache
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          python scripts/build_tesseract_windows.py build/tesseract-windows --vcpkg-root "$RUNNER_TEMP/vcpkg"
          build/tesseract-windows/tesseract.exe --version

      - name: Engine folder (PyInstaller, audio decoder, Tesseract on Windows and macOS)
        shell: bash
        run: |
          (cd services/local-engine && uv sync --frozen --python 3.12)
          $UV python scripts/package_engine.py

      - name: Smoke test the engine folder
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then exe=omnirecall-engine.exe; else exe=omnirecall-engine; fi
          $UV python scripts/smoke_engine.py "apps/desktop/src-tauri/resources/engine/$exe" --require-ocr --download-model

      - name: Installer
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}

      - name: Install, upgrade, uninstall (Linux .deb)
        if: runner.os == 'Linux'
        run: |
          deb=$(ls apps/desktop/src-tauri/target/release/bundle/deb/*.deb)
          name=$(dpkg-deb -f "$deb" Package)
          engine=$(dpkg-deb -c "$deb" | awk '{print $6}' | grep 'engine/omnirecall-engine$' | sed -E 's|^\.?/?|/|')
          sudo apt-get install -y "./$deb"
          xvfb-run -a $UV python scripts/install_check.py installed --app /usr/bin/omnirecall --engine "$engine"
          sudo apt-get install -y --reinstall "./$deb"
          $UV python scripts/install_check.py upgraded --engine "$engine"
          sudo apt-get remove -y "$name"
          $UV python scripts/install_check.py uninstalled --app /usr/bin/omnirecall --engine "$engine"

      - name: Install, upgrade, uninstall (macOS .dmg)
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          app=/Applications/OmniRecall.app
          install_app() {
            hdiutil attach "$dmg" -nobrowse -mountpoint /Volumes/OmniRecallInstall
            rm -rf "$app"
            cp -R /Volumes/OmniRecallInstall/OmniRecall.app /Applications/
            hdiutil detach /Volumes/OmniRecallInstall
          }
          install_app
          # The bundled Tesseract must work without Homebrew's.
          brew uninstall --ignore-dependencies tesseract
          $UV python scripts/install_check.py installed --app "$app/Contents/MacOS/omnirecall" --engine "$app/Contents/Resources/engine/omnirecall-engine"
          install_app
          $UV python scripts/install_check.py upgraded --engine "$app/Contents/Resources/engine/omnirecall-engine"
          rm -rf "$app"
          $UV python scripts/install_check.py uninstalled --app "$app/Contents/MacOS/omnirecall" --engine "$app/Contents/Resources/engine/omnirecall-engine"

      - name: Install, upgrade, uninstall (Windows NSIS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe).FullName
          $dir = Join-Path $env:LOCALAPPDATA "OmniRecall"
          $app = Join-Path $dir "omnirecall.exe"
          $engine = Join-Path $dir "engine\omnirecall-engine.exe"
          $uv = "uv run --project services/local-engine --frozen python scripts/install_check.py"
          Start-Process $setup -ArgumentList "/S" -Wait
          # The bundled Tesseract must be the only one.
          if (Get-Command tesseract -ErrorAction SilentlyContinue) { throw "a system Tesseract is on PATH" }
          Invoke-Expression "$uv installed --app `"$app`" --engine `"$engine`""
          if ($LASTEXITCODE) { exit 1 }
          Start-Process $setup -ArgumentList "/S" -Wait
          Invoke-Expression "$uv upgraded --engine `"$engine`""
          if ($LASTEXITCODE) { exit 1 }
          Start-Process (Join-Path $dir "uninstall.exe") -ArgumentList "/S" -Wait
          # The NSIS uninstaller finishes in a copy of itself; wait for it.
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep 1 }
          Invoke-Expression "$uv uninstalled --app `"$app`" --engine `"$engine`""
          if ($LASTEXITCODE) { exit 1 }

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            # One SBOM for the release; the Windows job has the bundled Tesseract to name.
            tess=$(apps/desktop/src-tauri/resources/engine/tesseract/tesseract.exe --version 2>&1 | head -1 | awk '{print $2}')
            $UV python scripts/sbom.py out/omnirecall-sbom.cdx.json --tesseract-version "$tess"
          fi
          find apps/desktop/src-tauri/target/release/bundle \( -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*-setup.exe' \) -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Build provenance for each installer
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/*.deb
            out/*.rpm
            out/*.dmg
            out/*-setup.exe
      - name: Checksums and draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --draft --prerelease \
            --title "OmniRecall $GITHUB_REF_NAME" --notes-file ../CHANGELOG.md ./*
