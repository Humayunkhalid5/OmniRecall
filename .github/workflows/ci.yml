name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: Engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: services/local-engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: Install Tesseract (and strace for the network audit on Linux)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng strace; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install tesseract; fi
          if [ "$RUNNER_OS" = "Windows" ]; then choco install tesseract -y --no-progress; echo "C:\Program Files\Tesseract-OCR" >> "$GITHUB_PATH"; fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Audio decoder (checks, tests, release build used by the engine tests)
        working-directory: services/audio-decoder
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo build --release
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
        env:
          # Every decoder-backed test must run in CI, not skip.
          OMNIRECALL_REQUIRE_AUDIO_DECODER: "1"

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Rust checks
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  real-models:
    # The real search and speech models, downloaded through the engine's own
    # checksum-verified ModelManager: relevance, speech-to-text accuracy, and
    # the network audit with real models (docs/measurements.md).
    name: Real models (ubuntu-24.04)
    runs-on: ubuntu-24.04
    env:
      DATA: ${{ github.workspace }}/real-models
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y strace
      - name: Audio decoder
        working-directory: services/audio-decoder
        run: cargo build --release --locked
      - run: uv sync --frozen --python 3.12
        working-directory: services/local-engine
      - uses: actions/cache@v4
        with:
          path: real-models/models
          key: models-${{ hashFiles('services/local-engine/omnirecall/model_manifests/*.json') }}
      - name: Download models (verified by the engine)
        working-directory: services/local-engine
        run: |
          uv run --frozen python - <<'PY'
          import os
          from pathlib import Path
          from omnirecall.models import ModelManager
          manager = ModelManager(Path(os.environ["DATA"]) / "models")
          for model_id in ("all-minilm-l6-v2", "whisper-base"):
              if not manager.is_installed(model_id):
                  manager.download(model_id)
              print(model_id, "installed:", manager.is_installed(model_id))
          PY
      - name: Speech-to-text accuracy (whisper.cpp base)
        working-directory: services/local-engine
        run: uv run --frozen python ../../scripts/eval_transcription.py "$DATA/models"
      - name: Relevance (hybrid, vector, keyword)
        working-directory: services/local-engine
        run: |
          for mode in hybrid vector keyword; do
            uv run --frozen python ../../scripts/eval_relevance.py "$DATA" --mode $mode
          done
      - name: Real-model tests and network audit
        working-directory: services/local-engine
        env:
          OMNIRECALL_TEST_MODELS_DIR: ${{ github.workspace }}/real-models/models
          OMNIRECALL_REQUIRE_AUDIO_DECODER: "1"
        run: uv run --frozen pytest -q -rs tests/test_audio.py tests/test_network_audit.py
