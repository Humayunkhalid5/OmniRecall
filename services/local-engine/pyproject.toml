[project]
name = "omnirecall-engine"
version = "0.1.0"
description = "OmniRecall local engine: ingestion, extraction, embeddings, retrieval"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "numpy==2.5.4",
  "pyarrow==26.0.0",
  "lancedb==0.40.0",
  "onnxruntime==1.31.0",
  "tokenizers==0.23.3",
  "pypdf==6.21.2",
  "python-docx==1.2.0",
  "Pillow==13.0.0",
  "pytesseract==0.3.13",
  "pydantic==2.14.1",
  "pywhispercpp==1.5.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-timeout==2.4.0",
  "ruff==0.17.1",
  "mypy==2.4.0",
  "psutil==7.1.0",
  "pyinstaller==6.22.3",
]

[project.scripts]
omnirecall-engine = "omnirecall.api.server:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omnirecall"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["omnirecall"]

[[tool.mypy.overrides]]
module = ["lancedb.*", "pyarrow.*", "pytesseract.*", "docx.*", "onnxruntime.*", "tokenizers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
